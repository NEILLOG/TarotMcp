name: Generate tarot card images

on:
  workflow_dispatch:
    inputs:
      only:
        description: "只跑這些卡（逗號分隔，例如 major_02,cups_01；留空＝全部）"
        required: false
        default: ""
      skip:
        description: "額外略過的卡（逗號分隔）"
        required: false
        default: ""
      limit:
        description: "本次最多呼叫 API 幾次（0＝不限制；想先試少量就填 3）"
        required: false
        default: "0"
      concurrency:
        description: "同時送出的請求數"
        required: false
        default: "3"
      cards:
        description: "要不要跑 78 張插畫（只想跑邊框時取消勾選）"
        type: boolean
        default: true
      frame_count:
        description: "邊框範本：產生幾張候選（0＝不產生；已存在的候選會略過）"
        required: false
        default: "0"
      frame_pick:
        description: "邊框範本：把第幾張候選轉正成 assets/frame/frame.png（例如 2；留空＝不動）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: generate-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pillow

      - name: Generate images
        id: gen
        if: inputs.cards
        env:
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_API_URL: https://api.openai.com/v1/images/generations
          IMAGE_MODEL: gpt-image-2.5-flare
          CARD_ONLY: ${{ inputs.only }}
          CARD_SKIP: ${{ inputs.skip }}
          CARD_LIMIT: ${{ inputs.limit }}
          CARD_CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          if [ -z "$IMAGE_API_KEY" ]; then
            echo "::error::找不到 repo secret IMAGE_API_KEY"; exit 2
          fi
          set +e
          python tools/generate_cards.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # 邊框範本（獨立一步；要還原就刪掉這一段、tools/generate_frame.py 與上面兩個 frame_* 輸入）
      - name: Generate frame template
        id: frame
        if: inputs.frame_count != '0' || inputs.frame_pick != ''
        env:
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_API_URL: https://api.openai.com/v1/images/generations
          IMAGE_MODEL: gpt-image-2.5-flare
          FRAME_COUNT: ${{ inputs.frame_count }}
          FRAME_PICK: ${{ inputs.frame_pick }}
        run: |
          if [ "$FRAME_COUNT" != "0" ] && [ -z "$IMAGE_API_KEY" ]; then
            echo "::error::找不到 repo secret IMAGE_API_KEY"; exit 2
          fi
          set +e
          python tools/generate_frame.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Contact sheet
        run: python tools/make_contact_sheet.py || true

      # 不管有沒有失敗都先把已完成的存回 repo，下次會自動續跑
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          if git diff --cached --quiet; then
            echo "沒有新檔案"; exit 0
          fi
          n=$(git diff --cached --name-only -- 'assets/cards/*.webp' | wc -l)
          f=$(git diff --cached --name-only -- 'assets/frame/*.png' | wc -l)
          git commit -m "assets: 產生塔羅牌圖片 ${n} 張、邊框圖 ${f} 張"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail if some cards failed
        if: steps.gen.outputs.code && steps.gen.outputs.code != '0'
        run: |
          echo "::error::有卡片生成失敗（見上方 Generate images 的 [fail] 行），已完成的已提交，重新執行 workflow 即可續跑"
          exit 1

      - name: Fail if frame failed
        if: steps.frame.outputs.code && steps.frame.outputs.code != '0'
        run: |
          echo "::error::邊框範本失敗（見上方 Generate frame template 的 [fail] 行），已完成的已提交，重新執行 workflow 即可續跑"
          exit 1
